services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: keycloak
    restart: unless-stopped
    env_file: .env
    ports:
      # 8080 is RAGFlow's web port (ragflow/.env SVR_WEB_HTTP_PORT) — use 8081
      - "127.0.0.1:8081:8080"
    command: start-dev --proxy-headers=xforwarded --health-enabled=true
