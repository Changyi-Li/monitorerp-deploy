services:
  nginx:
    image: nginx
    container_name: server-nginx
    network_mode: host
    volumes:
      - ./global.conf:/etc/nginx/conf.d/default.conf:ro
      # certbot webroot (ACME challenge files) + issued certs
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
