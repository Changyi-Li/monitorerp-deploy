# ---- RAGFlow (web UI + API) — https://ragflow.ai.monitorsystem.cn ---------
# HTTP: serve ACME challenges (needed for auto-renewal), redirect everything
# else to HTTPS.
server {
    listen 80;
    server_name ragflow.ai.monitorsystem.cn;

    # Let's Encrypt HTTP-01 challenge files (certbot --webroot) — keep for
    # automatic renewal
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ragflow.ai.monitorsystem.cn;

    ssl_certificate     /etc/letsencrypt/live/ragflow.ai.monitorsystem.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ragflow.ai.monitorsystem.cn/privkey.pem;

    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
        proxy_cache off;
    }
}

# ---- Catch-all: keep serving RAGFlow over HTTP for any other hostname / IP
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
        proxy_cache off;
    }
}
